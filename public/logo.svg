<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="50%" stop-color="#C86246" />
      <stop offset="100%" stop-color="#9C442B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#C86246" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background curved squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#FAF7F2" stroke="#EAE4DA" stroke-width="8"/>
  
  <!-- Outer glowing soft ring -->
  <circle cx="256" cy="256" r="140" stroke="#F1E8DF" stroke-width="24" />
  
  <!-- Flowing fluid arc -->
  <circle cx="256" cy="256" r="140" stroke="url(#terracottaGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="879.6" stroke-dashoffset="260" filter="url(#softGlow)" />
  
  <!-- Center lock-shackle / fluid core -->
  <circle cx="256" cy="256" r="64" fill="url(#terracottaGrad)" />
  <circle cx="256" cy="256" r="28" fill="#FAF7F2" />
  <rect x="246" y="256" width="20" height="34" rx="6" fill="#FAF7F2" />
</svg>
